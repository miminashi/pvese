# Server 15 (ayase-web-service-15) configuration
# DELL PowerEdge R430 - iDRAC8 (本拠点、4-9号機と同 10.10.10.0/8 + 192.168.39.0/24 DHCP)

hostname: ayase-web-service-15
domain: local

# Network (4-6号機と同じ配線: eno2=mgmt, eno1=DHCP/インターネット)
static_ip: 10.10.10.215
static_netmask: 8
static_iface: eno2
dhcp_iface: eno1

# Target disk (PERC RAID, /dev/sda = VD0; Phase 4 で実機確認)
disk: /dev/sda

# Debian installer
debian_version: 13
debian_codename: trixie
debian_iso_url: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-13.3.0-amd64-netinst.iso
debian_iso_sha256: c9f09d24b7e834e6834f2ffa565b33d6f1f540d04bd25c79ad9953bc79a8ac02

# SMB / VirtualMedia
smb_host: 10.1.6.1
smb_share_path: "\\public"
iso_filename: debian-preseed-s15.iso
iso_download_dir: /var/samba/public
remoteimage_uri: "//10.1.6.1/public/debian-preseed-s15.iso"

# BMC (iDRAC8)
bmc_type: idrac
bmc_ip: 10.10.10.35
bmc_user: claude
bmc_pass: Claude123
bmc_ssh_key: ssh/idrac_rsa
idrac_fw_version: "2.85.85.85"
idrac_fw_build: "02"
idrac_fw_updated: "2024-01-16"
bios_version: "2.15.0"
service_tag: "53221L2"

# Serial console (Phase 4 で BIOS.SerialCommSettings.SerialPortAddress を確認後に確定)
serial_unit: 0

# OS credentials (lab environment)
root_password: password
user_name: debian
user_password: password
