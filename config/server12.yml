# Server 12 (ayase-web-service-12) configuration
# Supermicro X10DRT-P / Nutanix NX-3060-G5 OEM (Twin Server sibling of 10号機)
# Verified 2026-05-02: BIOS G4G5T4.0, 20 cores, 64 GiB, Chassis CSE-217HQ+

hostname: ayase-web-service-12
domain: local

# Network — VLAN trunk environment (separate site from servers 4-9)
# Same trunk topology as 10号機: only `eno1` is link-up; untagged DHCP fails.
# 1 physical NIC carries a VLAN trunk (1120 + 1083 tagged).
# After install, vmbr0 sits on eno1.<internal_vlan_id> (10.0.0.0/8 mgmt),
# vmbr1 sits on eno1.<internet_vlan_id> (DHCP, internet). VM workloads attach
# to vmbr1.
static_ip: 10.10.10.212
static_netmask: 8
static_iface: vmbr0
dhcp_iface: vmbr1

# Static gateway on the internal management VLAN (10.0.0.0/8 = VLAN 1083);
# common with 4-9号機 even though the internet-side VLAN sits at a different
# site. Used by preseed netcfg fallback dialogs (the network is not actually
# usable during install — see late_command + pve-bridge-setup.sh).
static_gateway: 10.10.10.1

# VLAN trunk (10-13号機 only). Omit these fields on non-VLAN servers — scripts
# fall back to the legacy 4-9号機 path (physical NIC bridged directly).
# VLAN 1120: internet/DHCP. Subnet/GW determined dynamically (NOT 192.168.39.x;
# this is a different site than servers 4-9).
# VLAN 1083: management, 10.0.0.0/8 (common with 4-9号機).
vlan_iface: eno1
internet_vlan_id: 1120
internal_vlan_id: 1083

# Debian ISO
debian_version: 13
debian_codename: trixie
debian_iso_url: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-13.3.0-amd64-netinst.iso
debian_iso_sha256: c9f09d24b7e834e6834f2ffa565b33d6f1f540d04bd25c79ad9953bc79a8ac02

# Target disk - SATA SSD behind the LSI SAS HBA (mpt3sas driver), not PCH SATA.
# Same hardware family as 10号機; expected sd 0:0:0:0 [sda].
# NOTE: BIOS "LSI HBA OPROM" must be Enabled for Legacy disk first boot
# (see .claude/skills/bios-setup/reference.md, Issue #53).
disk: /dev/sda

# BMC
bmc_type: supermicro
bmc_ip: 10.10.10.32
bmc_user: claude
bmc_pass: Claude123

# SMB share for ISO hosting
smb_host: 10.1.6.1
smb_share_path: "\\public"
iso_filename: debian-preseed-s12.iso
iso_download_dir: /var/samba/public

# Serial console
# Same as 10号機 (X10DRT-P): COM2/SOL Console Redirection [Enabled],
# serial_unit: 1 (= ttyS1 = COM2). Verify on first boot via SOL.
serial_unit: 1

# OS credentials (lab environment)
root_password: password
user_name: debian
user_password: password
