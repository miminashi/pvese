# Training TX1320 M3 (Fujitsu PRIMERGY / iRMC S4)
# 一時設置・トレーニング用。クラスタ・LINSTOR 非参加。
#
# 本セッション (2026-05-16) で対応機種登録 + RAID10 構成まで完了。
# OS インストール (Debian + PVE) は次セッションで Virtual Media 自動化と一緒に実施予定。

hostname: training-tx1320
domain: local

# Network — initially set to DHCP-only but Phase 13 (2026-05-22 silly-rocket)
# discovered that d-i netcfg blocks on "invalid IPv4" dialog when DHCP fails
# and no static fallback is given. Switched to static IP for install reliability.
# - 192.168.33.0/24 (DHCP, インターネット可) — DHCP server present but d-i did not get lease
# - 10.254.254.0/24 (10.0.0.0/8 内サブネット, 管理用) — used for install-time static IP
# 実 NIC 名は SOL log で igb 0000:03:00.0 (eth0) と 0000:04:00.0 (eth1) を確認済
network_mode: static
static_iface: eth0
# Phase 14 (2026-05-22 linear-mountain): Phase 13 で使った 10.254.254.99 は
# pvese ローカルマシン (ens19) と ARP 衝突するため SSH 到達不能だった。
# 同 /24 内で conflict-free な 10.254.254.250 に変更 (gateway は変更不要)。
static_ip: 10.254.254.250
static_netmask: 24
static_gateway: 10.254.254.1

# Serial console for kernel cmdline (preseed late_command が console=ttyS${serial_unit} を書き込む)
# TX1320 M3 + iRMC S4 の SOL channel 1 / payload 4 の物理シリアル port は要 install 時検証
# 一般的には ttyS0 (= serial_unit: 0)。OS install 後に SOL ログで実際の getty を確認して調整
serial_unit: 0

# Target disk — HW RAID10 VD0 (SAS HDD 900GB × 4 → 実効 1.8 TB)
# Phase 8 で構成。VD0 は通常 /dev/sda、ドライバ次第で別名の可能性あり
# OS install 時に lsblk で確定して書き換え
disk: /dev/sda  # tentative — to be confirmed at OS install

# RAID 構成
raid_level: 10
raid_disk_count: 4
raid_disk_size: 900GB
raid_disk_type: SAS HDD
raid_controller: "PRAID EP400i"   # LSI MegaRAID SAS3008 (Slot 4), UEFI HII via Advanced tab

# BIOS 設定 (Layer 1: WinSCU XML 経由で apply-config が当てる項目)
# 値は WinSCU XML の <supportedSetting>/<value> と一致する文字列を入れる
bios_settings:
  supported:
    BootOptionFilter: "UEFI only"          # boot 対象を UEFI に絞る (Legacy entry を排除)
    LaunchStorageOpRomPolicy: "UEFI only"   # PRAID EP400i など Storage OpROM を UEFI に
    LaunchPxeOpRomPolicy: "UEFI only"       # PXE OpROM を UEFI に
    LaunchVideoOpRomPolicy: "UEFI only"     # Video OpROM を UEFI に
    SerialPort1: "Enabled"                  # SOL 用 (現状 Enabled、確認のみ)
    Csm: "Disabled"                          # CSM を Disabled (UEFI mode)

# BMC (Fujitsu iRMC S4)
bmc_type: irmc
bmc_ip: 10.254.254.9
bmc_user: claude
bmc_pass: Claude123
bmc_user_index: 4               # admin=2, root=3, claude=4
bmc_scheme: https               # HTTPS で動く (古い DH 鍵対策で curl_opts 必須)
bmc_curl_opts: "--ciphers DEFAULT@SECLEVEL=0"
power_on_reset_type: On               # iRMC は PowerState で AllowableValues が変わる: Off->["On"], On->["ForceOff","ForceRestart","Nmi","PushPowerButton"]。Off→On 遷移には "On" を使う
bmc_patch_requires_etag: "1"          # iRMC Redfish PATCH は If-Match (quotes なし) 必須。quotes 付きだと 412
bmc_boot_override_no_disabled: "1"    # iRMC の BootSourceOverrideEnabled は ["Once","Continuous"] のみ。reset 時は Target=None で代用
ipmi_sol_channel: 2             # SOL は payload enable 2 4 が必要 (claude=user 4)

# iRMC ライセンス (Phase 2 で確認)
irmc_licenses:
  - KVM       # Permanent — HTML5 KVM 利用可能 (Html5Enabled=true)
  - MEDIA     # Permanent — Virtual Media 利用可能 (CDImage 2 スロット)
# eLCM ライセンスなし → eLCM 経由の RAID 操作不可。RAID は BIOS RAID Util を KVM 経由で操作

# RAID setup — KVM HII 経路は 2026-05-17 #4 dead-end 確定 (Select RAID Level y=128 到達不能、
# Profile-Based VD は RAID 0/1/5/6 のみで RAID 10 不在)。
# 2026-05-17 #5 で **storcli + preseed 経路**に転換。 KVM 操作なしで RAID10 + Debian install 完結。
# 詳細: .claude/skills/irmc-bios-raid/SKILL.md「RAID10 storcli + preseed 経路」セクション
#       および report/2026-05-17_*_tx1320_raid10_*.md
# 使い方: ./scripts/tx1320-raid10-orchestrate.sh apply config/training_tx1320.yml
# 以下の raid_setup.* (avago_arrowdown 等) は KVM 経路用の DEPRECATED 値、 storcli 経路では未使用
raid_setup:
  avago_arrowdown: 14         # DEPRECATED (KVM 経路、 dead-end)
  cfgmgmt_arrowdown: 0        # DEPRECATED
  createvd_arrowdown: 0       # DEPRECATED
  raid10_arrowdown: 5         # DEPRECATED
  drives_check_all_down: 8    # DEPRECATED
  drives_apply_down: 2        # DEPRECATED
  vdlist_arrowdown: 2         # DEPRECATED

# Cluster membership
in_pve_cluster: false
in_linstor: false

# OS credentials (lab environment) — 次セッションで使用
root_password: password
user_name: debian
user_password: password

# Virtual Media share protocol — "nfs" (default) or "smb".
# iRMC S4 FW 9.08F の SMB worker は 2026-05-20 以降死亡継続中 (5 経路試行で復活せず、
# silly-token / s-snuggly-goblet で確認)。 NFS worker は別 process で生存しており、
# 2026-05-21 s-snuggly-goblet で OEM Virtual Media が NFS をサポートすることを実証。
# 以後 training-tx1320 のデフォルト経路は NFS (PATCH ShareType="NFS" + ConnectCD)。
# SMB 関連 key (smb_*) は rollback 用に温存。
virtual_media_type: nfs

# NFS server / export for Virtual Media (orchestrator が PATCH に渡す)
# ImageName は orchestrator が <hostname>-raid10.iso を組み立てるため、 ファイルは
# 10.1.6.6:/var/samba/public/debian-training-tx1320-raid10.iso に配置すること
nfs_host: 10.1.6.6
nfs_export_path: /var/samba/public

# SMB share for Virtual Media (rollback / failover 用、 現状は使用しない)
# 既存ホスト 10.1.6.1 / //10.1.6.1/public が training-tx1320 (別拠点) から到達できるかは
# Phase F で実際にマウント試行するまで不明。失敗時は別の SMB ロケーションへ切替
smb_host: 10.1.6.1
smb_share_path: "\\public"
# iRMC S4 (FW 9.08F) は SMB CDImage の UserName/Password を必ず明示する必要がある (空文字列だと
# silent reject、 Members@odata.count=0 のまま attach されない)。 Web UI 手動操作で guest/guest +
# Domain 空欄で attach 成功した実績あり (2026-05-17 #5 → #6 で真因確定)。
smb_user: guest
smb_pass: guest

# ISO 名 (orchestrator は HOSTNAME ベースで <hostname>-raid10.iso を build/参照するため
# 実際にはこの key は参照されないが、 ドキュメント整合性のため記載)
iso_filename: debian-training-tx1320-raid10.iso
iso_download_dir: /var/samba/public
