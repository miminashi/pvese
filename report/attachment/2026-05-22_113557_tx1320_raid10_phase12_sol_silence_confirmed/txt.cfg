default auto
label auto
  menu label ^Automated Install
  kernel /install.amd/vmlinuz
  append auto=true priority=critical preseed/file=/preseed.cfg locale=en_US.UTF-8 keymap=us netcfg/choose_interface=auto cdrom-detect/try-usb=true cdrom-detect/scan=true hw-detect/load_media=false console=tty0 console=ttyS0,115200n8 earlyprintk=ttyS0,115200n8 loglevel=8 ignore_loglevel  initrd=/install.amd/initrd.gz ---
label install
  menu label ^Install
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz earlyprintk=ttyS0,115200n8 loglevel=8 ignore_loglevel ---
