set default=0
set timeout=3

serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

search --file --set=root /install.amd/vmlinuz

menuentry "Automated Install" {
    linux /install.amd/vmlinuz vga=normal nomodeset auto=true priority=critical preseed/file=/preseed.cfg locale=en_US.UTF-8 keymap=us netcfg/choose_interface=auto cdrom-detect/try-usb=true cdrom-detect/scan=true hw-detect/load_media=false console=tty0 console=ttyS0,115200n8 earlyprintk=ttyS0,115200,keep --- quiet
    initrd /install.amd/initrd.gz
}
