  - id: 47
    title: 'server 7 NVRAM 枯渇 (preseed cleanup では救済不能): BIOS Delete Boot Options or racadm systemerase nvramclr 検討'
    status: plan
    owner: ""
    created: "2026-04-11T03:34:56Z"
    updated: "2026-05-15T07:35:31Z"
    blocked_by: ""
    report: "report/2026-05-14_091100_os_setup_18trial_x10dpu_r320.md"
    labels: []
    description: |
      Dell R320 + iDRAC7 系 (server 7-9) で NVRAM efivars が枯渇すると、
      preseed/early_command の Boot#### cleanup を実施しても grub-install が
      "efivarfs_set_variable: No space left on device" で失敗する。

      2026-05-14 検証 (18 trial) で再確認:
        - server 9 Round 1+2: 6/6 attempt が grub-install で発火
        - server 9 Round 3: 1/1 attempt で発火せず install 完走
          → NVRAM 枯渇は**間欠故障**として個体差で発生することが確証された

      発火タイミング: preseed 初回 install の grub-install フェーズ。
      preseed/early_command の efivars cleanup は実行されているが、間欠的に
      cleanup 後の空き領域でも書き込みに失敗するケースが残る。

      回避策候補 (要検証):
        1. BIOS Setup から "Delete All System Setup Boot Options" 手動実行
        2. racadm systemerase nvramclr (Service Tag 等の出荷情報も消える可能性)
        3. preseed/early_command で chattr -i + rm に加え NvVar 系も削除
        4. Round 単位の racreset soft で NVRAM コントローラ側を初期化

      関連: trial-1-s9.md, trial-2-s9.md, trial-3-s9.md
      (report/attachment/2026-05-14_091100_os_setup_18trial_x10dpu_r320/)
